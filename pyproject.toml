[tool.poetry]
name = "tanuki-pii"
version = "0.1.0"
description = "Kong AI Sanitizer 互換の日本語強化 PII Service (CPU専用 sidecar)"
authors = ["Kong SE Japan"]
readme = "README.md"
packages = [{ include = "tanuki_pii" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.34" }
gunicorn = "^23"
pydantic = "^2.9"
presidio-analyzer = "2.2.361"
presidio-anonymizer = "2.2.361"
langdetect = "^1.0.9"
Faker = "^30"
transformers = "^4.46"
# CPU-only wheel を強制（GPU 依存を引き込まない）。
torch = { version = "^2.5", source = "pytorch-cpu-only" }
fugashi = "^1.3"
unidic-lite = "^1.0.8"
regex = "^2024.9"
sudachipy = "^0.6.8"
sudachidict-core = "^20240716"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.27"

# CPU専用 torch を取得するための index（Linux/Docker 向け）。
# macOS ローカルでは通常の PyPI wheel が CPU 版なので未使用でよい。
[[tool.poetry.source]]
name = "pytorch-cpu-only"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest.ini_options]
markers = [
    "bert: BERT(transformers)モデルを実際にロードするテスト",
    "integration: 起動済みサーバ/参照実装に対する結合テスト",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
